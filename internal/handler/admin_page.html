<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epsilon 授权管理</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --danger-bg: #7f1d1d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  h1 .dot { color: var(--accent); }
  .stats { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .stats span b { color: var(--text); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 16px; font-size: 15px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .form-row {
    display: grid;
    grid-template-columns: 2fr 1fr 2fr auto;
    gap: 12px;
    align-items: end;
  }
  label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  input, button {
    font-family: inherit; font-size: 14px;
    padding: 9px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    cursor: pointer; background: var(--accent); border-color: var(--accent);
    font-weight: 500; padding: 9px 18px;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button.danger { background: transparent; border-color: var(--border); color: var(--err); padding: 4px 10px; font-size: 12px; }
  button.danger:hover { background: var(--danger-bg); color: white; border-color: var(--err); }
  button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  button.ghost:hover { background: var(--border); color: var(--text); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: 0.8px; }
  td.mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 12px; }
  tr:hover td { background: rgba(255,255,255,0.02); }

  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 500;
  }
  .pill.ok { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
  .pill.warn { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
  .pill.err { background: rgba(239, 68, 68, 0.15); color: var(--err); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar .search { flex: 1; max-width: 300px; }

  #toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 16px; font-size: 13px;
    opacity: 0; transform: translateY(10px); transition: all 0.2s;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok { border-color: var(--ok); }
  #toast.err { border-color: var(--err); }

  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="dot">●</span> Epsilon 授权管理</h1>
    <div class="stats">
      <span>总数 <b id="stat-total">0</b></span>
      <span>有效 <b id="stat-valid" style="color: var(--ok)">0</b></span>
      <span>即将过期 <b id="stat-warn" style="color: var(--warn)">0</b></span>
      <span>已过期 <b id="stat-expired" style="color: var(--err)">0</b></span>
    </div>
  </header>

  <div class="card">
    <h2>新增 / 续期</h2>
    <form id="upsert-form" class="form-row">
      <label>机器码
        <input id="in-code" type="text" placeholder="MACHINE-XXXX" required autocomplete="off">
      </label>
      <label>有效天数
        <input id="in-days" type="number" placeholder="365" required min="1" value="365">
      </label>
      <label>备注 (可选)
        <input id="in-note" type="text" placeholder="客户名 / 来源 / 备注" autocomplete="off">
      </label>
      <button type="submit">保存</button>
    </form>
    <p class="muted" style="margin: 12px 0 0;">
      · 已存在的机器码会被<b>覆盖</b>到期时间（从今天起算 N 天）<br>
      · 想续期一年就写 365，永久授权可以填 36500（100 年）
    </p>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2 style="margin:0;">授权列表</h2>
      <div style="display: flex; gap: 8px;">
        <input class="search" id="search" type="text" placeholder="搜索机器码或备注..." autocomplete="off">
        <button class="ghost" id="btn-refresh">刷新</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>机器码</th>
          <th>到期时间</th>
          <th>状态</th>
          <th>备注</th>
          <th>更新时间</th>
          <th style="text-align:right;">操作</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="6" class="empty">加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const $ = (sel) => document.querySelector(sel);
const tbody = $('#tbody');
const search = $('#search');
let cache = [];

function fmtTime(unix) {
  if (!unix) return '-';
  const d = new Date(unix * 1000);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function daysLeft(expireAt) {
  const now = Math.floor(Date.now() / 1000);
  return Math.floor((expireAt - now) / 86400);
}

function status(expireAt) {
  const d = daysLeft(expireAt);
  if (d < 0)  return { cls: 'err',  text: `已过期 ${-d} 天` };
  if (d < 7)  return { cls: 'warn', text: `${d} 天内过期` };
  return { cls: 'ok', text: `剩余 ${d} 天` };
}

function toast(msg, ok = true) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'show ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.className = '', 2500);
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function render() {
  const q = search.value.trim().toLowerCase();
  const filtered = q
    ? cache.filter(l => l.machine_code.toLowerCase().includes(q) || (l.note || '').toLowerCase().includes(q))
    : cache;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">${q ? '没有匹配的授权' : '还没有授权，用上面的表单添加'}</td></tr>`;
  } else {
    tbody.innerHTML = filtered.map(l => {
      const st = status(l.expire_at);
      return `
        <tr>
          <td class="mono">${escapeHtml(l.machine_code)}</td>
          <td>${fmtTime(l.expire_at)}</td>
          <td><span class="pill ${st.cls}">${st.text}</span></td>
          <td>${escapeHtml(l.note || '')}</td>
          <td class="muted">${fmtTime(l.updated_at)}</td>
          <td style="text-align:right;">
            <button class="ghost" data-act="edit" data-code="${escapeAttr(l.machine_code)}" data-note="${escapeAttr(l.note || '')}">续期</button>
            <button class="danger" data-act="del" data-code="${escapeAttr(l.machine_code)}">删除</button>
          </td>
        </tr>`;
    }).join('');
  }

  // Stats
  const now = Math.floor(Date.now() / 1000);
  $('#stat-total').textContent = cache.length;
  $('#stat-valid').textContent = cache.filter(l => l.expire_at > now && daysLeft(l.expire_at) >= 7).length;
  $('#stat-warn').textContent = cache.filter(l => l.expire_at > now && daysLeft(l.expire_at) < 7).length;
  $('#stat-expired').textContent = cache.filter(l => l.expire_at <= now).length;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(s) { return escapeHtml(s); }

async function load() {
  try {
    const data = await api('GET', 'api/licenses');
    cache = data.licenses || [];
    render();
  } catch (e) {
    toast('加载失败: ' + e.message, false);
  }
}

// 事件绑定
$('#upsert-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    machine_code: $('#in-code').value.trim(),
    days: parseInt($('#in-days').value, 10),
    note: $('#in-note').value.trim(),
  };
  if (!body.machine_code || !body.days) return;
  try {
    await api('POST', 'api/licenses', body);
    toast(`已保存 ${body.machine_code}`);
    $('#in-code').value = '';
    $('#in-note').value = '';
    await load();
  } catch (e) {
    toast('保存失败: ' + e.message, false);
  }
});

tbody.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const act = btn.dataset.act;
  const code = btn.dataset.code;
  if (act === 'del') {
    if (!confirm(`确认删除授权 "${code}"?\n此操作不可撤销。`)) return;
    try {
      await api('DELETE', 'api/licenses/' + encodeURIComponent(code));
      toast(`已删除 ${code}`);
      await load();
    } catch (e) { toast('删除失败: ' + e.message, false); }
  } else if (act === 'edit') {
    $('#in-code').value = code;
    $('#in-note').value = btn.dataset.note || '';
    $('#in-days').value = 365;
    $('#in-days').focus();
    $('#in-days').select();
  }
});

search.addEventListener('input', render);
$('#btn-refresh').addEventListener('click', load);

load();
</script>
</body>
</html>
